name: Update GL.iNet RU bypass list

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Amnezia IP list
        run: |
          curl -fL \
            https://github.com/lib4u/amnezia-tunneling-ru/releases/download/latest/amnezia-ip.json \
            -o amnezia-ip.json

      - name: Convert to GL.iNet format
        run: |
          jq -r '.[].hostname' amnezia-ip.json \
            | sed '/^$/d' \
            | sort -u \
            > ru-bypass.txt

      - name: Commit changes
        run: |
          rm amnezia-ip.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ru-bypass.txt

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update RU bypass list"
          git push
